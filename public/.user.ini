; PHP-FPM/CGI: protege también avisos emitidos antes de bootstrap.
display_errors=Off
display_startup_errors=Off
log_errors=On
; Configurar expose_php=Off y session.auto_start=0 también en php.ini del servidor.
upload_max_filesize=10M
post_max_size=12M
max_file_uploads=1
memory_limit=256M
max_execution_time=60
session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_httponly=1
session.cookie_samesite=Lax

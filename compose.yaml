name: escall-plataforma-dev

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8088
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: escall_plataforma_docker
      DB_USERNAME: escall_docker
      DB_PASSWORD: ${ESCALL_DB_PASSWORD:-escall_local_only}
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_COOKIE: escall_plataforma_docker_session
      SESSION_SECURE_COOKIE: "false"
      TRUSTED_PROXIES: ""
      LEGACY_PASSWORDS_ALLOWED: "false"
    volumes:
      - ./:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - composer_cache:/tmp/composer
      - laravel_runtime:/var/www/.docker-runtime
      - laravel_framework:/var/www/html/storage/framework
      - laravel_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27.4-alpine
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - composer_vendor:/var/www/html/vendor:ro
    depends_on:
      - app

  db:
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: escall_plataforma_docker
      MYSQL_USER: escall_docker
      MYSQL_PASSWORD: ${ESCALL_DB_PASSWORD:-escall_local_only}
      MYSQL_ROOT_PASSWORD: ${ESCALL_DB_ROOT_PASSWORD:-escall_root_local_only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  node:
    image: node:20.19.0-bookworm-slim
    working_dir: /var/www/html
    command: >-
      sh -lc 'if [ ! -x node_modules/.bin/vite ]; then npm ci; fi;
      exec npm run dev -- --host 0.0.0.0 --port 5173'
    ports:
      - "5178:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules

volumes:
  mysql_data:
  composer_vendor:
  composer_cache:
  node_modules:
  laravel_runtime:
  laravel_framework:
  laravel_bootstrap_cache:
